      value: "2026"
      type: query
      disabled: true
    - name: student
      value: ~me
      type: query
      disabled: true
    - name: fields
      value: id,subjectCode,subjectName,groupName,departmentCode,branchCode,students,teachers
      type: query
      disabled: true
    - name: branchCode
      value: 01kl
      type: query
      disabled: true
    - name: departmentCode
      value: ""
      type: query
      disabled: true
    - name: id
      value: ""
      type: query
      disabled: true
    - name: schoolInSchoolYear
      value: ""
      type: query
      disabled: true
    - name: teacher
      value: ""
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false


info:
  name: announcements
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/v3/announcements?user={{user}}&current=true"
  headers:
    - name: Authorization
      value: Bearer {{access_token}}
  params:
    - name: user
      value: "{{user}}"
      type: query
    - name: current
      value: "true"
      type: query
      description: must always be true
    - name: fields
      value: id,title,text,start,read
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
